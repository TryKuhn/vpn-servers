[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpn-manager"
version = "0.1.0"
description = "User management service for vpn-servers (CLI today, HTTP API + bot later)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
authors = [
    { name = "TryKuhn" },
]
keywords = ["vpn", "xray", "vless", "reality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]

dependencies = [
    "qrcode[pil]>=7.4",        # QR codes in terminal & PNG
    "platformdirs>=4.2",       # data dir resolution (cross-platform safety)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",                # linting + formatting in one tool
    "mypy>=1.10",
    "types-qrcode",             # type stubs
]

[project.scripts]
# Installs `vpn-user` as a binary in $PATH when the package is installed.
vpn-user = "vpn_manager.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vpn_manager"]

# ============================================================================
# Tooling
# ============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pyflakes + pycodestyle
    "I",               # isort (import sorting)
    "N",               # pep8-naming
    "UP",              # pyupgrade
    "B",               # flake8-bugbear
    "SIM",             # flake8-simplify
    "RUF",             # ruff-specific
]
ignore = [
    "E501",            # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
