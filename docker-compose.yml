# ============================================================================
#  vpn-servers — docker-compose
# ============================================================================
#
#  Services:
#    - config-init: one-shot, renders xray config from template via envsubst
#    - xray:        the actual VLESS+Reality VPN server (host network, :443)
#    - manager:     Python service for user management (CLI today, more later)
#
#  Network model: all services run on host network.
#  nginx stream owns :443 and routes by SNI:
#    NGINX_DOMAIN  → nginx HTTPS on :4430  (subscriptions + WebSocket proxy)
#    any other SNI → xray Reality on :8443 (VPN)
#  xray also binds :10443 (WebSocket inbound, localhost-only).
#  Manager reaches xray's gRPC API at 127.0.0.1:10085.
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # config-init — render config.json from template
  # ---------------------------------------------------------------------------
  config-init:
    image: alpine:3.20
    container_name: vpn-config-init
    restart: "no"
    volumes:
      - ./config/xray:/templates:ro
      - ./data/xray:/output
      - ./docker/xray/render-config.sh:/render.sh:ro
    env_file:
      - .env
    command: >
      sh -c "apk add --no-cache gettext > /dev/null && sh /render.sh"

  # ---------------------------------------------------------------------------
  # data-init — fix ownership of ./data for the manager user
  # ---------------------------------------------------------------------------
  # Manager runs as uid=1000 inside its container, but ./data is created by
  # other services (config-init, xray) running as root. This one-shot fixes
  # ownership so manager can write users.json.
  data-init:
    image: alpine:3.20
    container_name: vpn-data-init
    restart: "no"
    volumes:
      - ./data:/data
    command: >
      sh -c "
        mkdir -p /data &&
        chown -R 1000:1000 /data &&
        chmod -R u+rwX,go+rX /data &&
        echo '✓ /data ownership set to uid=1000'
      "

  # ---------------------------------------------------------------------------
  # xray — the VPN server itself
  # ---------------------------------------------------------------------------
  xray:
    image: teddysun/xray:25.12.8
    container_name: vpn-xray
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/xray:/etc/xray
      - ./docker/xray/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "netstat -tlnp 2>/dev/null | grep -q ':8443.*LISTEN' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # manager — Python service for user management
  # ---------------------------------------------------------------------------
  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    image: vpn-manager:25.12.8
    container_name: vpn-manager
    restart: unless-stopped

    # Host network: needed to reach xray's gRPC API on 127.0.0.1:10085.
    # Without this, "127.0.0.1" inside the manager container would point to
    # itself, not to the xray container.
    network_mode: host

    volumes:
      # Mount data directory so manager can persist users.json and read
      # the live xray config (for sync operations).
      - ./data:/data

    env_file:
      - .env

    # Manager waits for xray to be healthy before starting. This avoids
    # spurious errors when manager tries to talk to xray's API too early.
    depends_on:
      xray:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # nginx — TLS termination for the subscription server + WebSocket proxy
  # ---------------------------------------------------------------------------
  # Listens on :443 (HTTPS) for subscription URLs and WebSocket (VPN),
  # and :80 (HTTP) for Let's Encrypt ACME-challenge. Forwards to manager:8080.
  # Bundled with certbot for automatic certificate renewal.
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: vpn-nginx:latest
    container_name: vpn-nginx
    restart: unless-stopped

    network_mode: host

    # certbot needs persistent storage for certificates between restarts,
    # otherwise we'd request a new cert every time and hit Let's Encrypt
    # rate limits very quickly.
    volumes:
      - ./data/letsencrypt:/etc/letsencrypt
      - ./data/certbot-www:/var/www/certbot

    environment:
      # Variables consumed by jonasal/nginx-certbot at startup.
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # Variables consumed by envsubst in our template.
      NGINX_DOMAIN: ${NGINX_DOMAIN}
      WS_PATH: ${WS_PATH}
      # Use the staging environment for Let's Encrypt during initial
      # setup. Set to '0' once you've verified everything works.
      # Staging has WAY more lenient rate limits.
      STAGING: ${ACME_STAGING:-1}
      # Renewal interval in seconds. Default 8h. We bump to 12h to be
      # gentler on Let's Encrypt's servers.
      RENEWAL_INTERVAL: 43200

    depends_on:
      manager:
        condition: service_started

  # ---------------------------------------------------------------------------
  # cloudflared — Cloudflare Tunnel daemon
  # ---------------------------------------------------------------------------
  # Punches an outbound-only encrypted tunnel to Cloudflare's edge so the
  # WebSocket VPN endpoint is reachable even when ISP DPI blocks VLESS over
  # regular Cloudflare CDN. No inbound port needed — cloudflared dials out.
  #
  # Setup (one-time, in Cloudflare Zero Trust dashboard):
  #   1. Networks → Tunnels → Create a tunnel → give it a name
  #   2. Public Hostname: ws.<your-domain> → http://localhost:10443
  #   3. Copy the tunnel token → CLOUDFLARE_TUNNEL_TOKEN in .env
  #   4. Set CLOUDFLARE_WS_DOMAIN=ws.<your-domain> in .env
  #
  # If CLOUDFLARE_TUNNEL_TOKEN is not set, this container exits cleanly
  # (exit 0) and does not restart — all other services are unaffected.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vpn-cloudflared
    profiles:
      - cloudflared
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      xray:
        condition: service_healthy
