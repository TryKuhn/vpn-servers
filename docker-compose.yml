# ============================================================================
#  vpn-servers — docker-compose
# ============================================================================
#
#  Services:
#    - config-init: one-shot, renders xray config from template via envsubst
#    - xray:        the actual VLESS+Reality VPN server (host network, :443)
#
#  In v0.5.x manager will be added here as a separate service.
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # config-init — render config.json from template
  # ---------------------------------------------------------------------------
  # Runs once on `docker compose up`, exits with 0. Must complete before xray
  # starts. Uses a tiny alpine image with envsubst (from gettext package).
  config-init:
    image: alpine:3.20
    container_name: vpn-config-init
    restart: "no"
    volumes:
      - ./config/xray:/templates:ro
      - ./data/xray:/output
      - ./docker/xray/render-config.sh:/render.sh:ro
    env_file:
      - .env
    # Install gettext (envsubst) and run the render script.
    # `apk add` is fast on a minimal alpine image (~1s on a fresh pull).
    command: >
      sh -c "apk add --no-cache gettext > /dev/null && sh /render.sh"

  # ---------------------------------------------------------------------------
  # xray — the VPN server itself
  # ---------------------------------------------------------------------------
  xray:
    image: teddysun/xray:latest
    container_name: vpn-xray
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/xray:/etc/xray
      - ./docker/xray/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

    # Wait for config-init to complete successfully before starting.
    depends_on:
      config-init:
        condition: service_completed_successfully

    healthcheck:
      test: [ "CMD-SHELL", "/bin/netstat -tln | grep -q ':${SERVER_PORT:-443} ' || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
