services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    container_name: vpn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  manager:
    build:
      context: .
      target: manager
    container_name: vpn-manager
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./rendered:/app/rendered
      - ./backups:/app/backups
      - ./certs:/certs:ro
    ports:
      - "127.0.0.1:${MANAGER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  xray:
    image: ghcr.io/xtls/xray-core:${XRAY_VERSION:-latest}
    container_name: vpn-xray
    restart: unless-stopped
    expose:
      - "${XRAY_LISTEN_PORT:-1443}"
    volumes:
      - ./rendered/xray/config.json:/etc/xray/config.json:ro
    command: ["run", "-c", "/etc/xray/config.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "xray", "run", "-test", "-c", "/etc/xray/config.json"]
      interval: 30s
      timeout: 10s
      retries: 3

  hysteria:
    image: tobyxdd/hysteria:${HYSTERIA_VERSION:-latest}
    container_name: vpn-hysteria
    restart: unless-stopped
    ports:
      - "${PUBLIC_UDP_PORT:-443}:443/udp"
    volumes:
      - ./rendered/hysteria/config.yaml:/etc/hysteria/config.yaml:ro
      - ./certs:/certs:ro
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    healthcheck:
      test: ["CMD", "hysteria", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  naive:
    build:
      context: .
      target: naive
    container_name: vpn-naive
    restart: unless-stopped
    expose:
      - "2443"
    volumes:
      - ./rendered/naive/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  haproxy:
    image: haproxy:${HAPROXY_VERSION:-3.0-alpine}
    container_name: vpn-haproxy
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "${PUBLIC_TCP_PORT:-443}:443/tcp"
    volumes:
      - ./rendered/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      xray:
        condition: service_healthy
      naive:
        condition: service_healthy
      manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
