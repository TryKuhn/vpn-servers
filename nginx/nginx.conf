user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    include /etc/nginx/conf.d/*.conf;
}

# Port 443 is multiplexed between two backends using TLS SNI inspection.
# The stream proxy peeks at the ClientHello (no TLS termination here),
# reads the server_name, and forwards the raw TCP stream:
#
#   NGINX_DOMAIN (trykuhn.xyz)  → Nginx HTTPS on :4430  (subscription + WebSocket)
#   any other SNI               → Xray Reality on :8443  (VLESS+Reality VPN)
#
# This lets Reality clients connect on port 443 — bypassing ISP blocks on
# non-standard ports. Clients use server_ip:443 with SNI=gateway.icloud.com.
stream {
    include /etc/nginx/stream.d/*.conf;
}
