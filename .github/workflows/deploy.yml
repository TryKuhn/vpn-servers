name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-prod
  cancel-in-progress: false
env:
  HEALTH_TIMEOUT: 180
  HEALTH_INTERVAL: 5
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          NEW_COMMIT: ${{ github.sha }}
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' NEW_COMMIT='${NEW_COMMIT}' HEALTH_TIMEOUT='${HEALTH_TIMEOUT}' HEALTH_INTERVAL='${HEALTH_INTERVAL}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          OLD_COMMIT=$(git rev-parse HEAD)
          echo "→ Current commit: $OLD_COMMIT"
          echo "→ Target commit:  $NEW_COMMIT"
          if [ "$OLD_COMMIT" = "$NEW_COMMIT" ]; then echo "✓ Already at target commit"; exit 0; fi
          echo "→ Creating pre-deploy backup"
          make backup || echo "WARN: backup failed; continuing deploy"
          git fetch origin main
          git reset --hard origin/main
          if ! make predeploy; then echo "✗ predeploy failed; rolling back git to $OLD_COMMIT"; git reset --hard "$OLD_COMMIT"; exit 1; fi
          make up.fast
          docker compose restart xray hysteria naive haproxy
          DEADLINE=$(($(date +%s) + HEALTH_TIMEOUT))
          HEALTHY=0
          INITIAL_MANAGER_RESTARTS=$(docker inspect --format '{{.RestartCount}}' vpn-manager 2>/dev/null || echo 0)
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            HAPROXY_STATE=$(docker inspect --format '{{.State.Health.Status}}' vpn-haproxy 2>/dev/null || echo missing)
            XRAY_STATE=$(docker inspect --format '{{.State.Health.Status}}' vpn-xray 2>/dev/null || echo missing)
            NAIVE_STATE=$(docker inspect --format '{{.State.Health.Status}}' vpn-naive 2>/dev/null || echo missing)
            MANAGER_STATE=$(docker inspect --format '{{.State.Health.Status}}' vpn-manager 2>/dev/null || echo missing)
            POSTGRES_STATE=$(docker inspect --format '{{.State.Health.Status}}' vpn-postgres 2>/dev/null || echo missing)
            HYSTERIA_STATE=$(docker inspect --format '{{.State.Health.Status}}' vpn-hysteria 2>/dev/null || echo missing)
            MANAGER_RESTARTS=$(docker inspect --format '{{.RestartCount}}' vpn-manager 2>/dev/null || echo 0)
            RESTART_DELTA=$((MANAGER_RESTARTS - INITIAL_MANAGER_RESTARTS))
            if [ "$RESTART_DELTA" -gt 2 ]; then echo "✗ manager restarted $RESTART_DELTA times"; break; fi
            if [ "$HAPROXY_STATE" = healthy ] && [ "$XRAY_STATE" = healthy ] && [ "$NAIVE_STATE" = healthy ] && [ "$MANAGER_STATE" = healthy ] && [ "$POSTGRES_STATE" = healthy ] && [ "$HYSTERIA_STATE" = healthy ]; then
              if curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null; then echo "✓ all services healthy"; HEALTHY=1; break; fi
            fi
            echo "  haproxy=$HAPROXY_STATE xray=$XRAY_STATE naive=$NAIVE_STATE hysteria=$HYSTERIA_STATE manager=$MANAGER_STATE postgres=$POSTGRES_STATE"
            sleep "$HEALTH_INTERVAL"
          done
          if [ "$HEALTHY" -ne 1 ]; then echo "✗ deploy healthcheck failed; rolling back code to $OLD_COMMIT"; git reset --hard "$OLD_COMMIT"; make up || echo "WARN: rollback make up failed; manual intervention required"; exit 1; fi
          echo "✓ Deployment successful"
          REMOTE_SCRIPT
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_ed25519
